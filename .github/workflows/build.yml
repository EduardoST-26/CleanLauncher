name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;36.0.0"

      # Fixed signing key from repo secrets, so each APK installs over the previous one.
      # Without the secrets (e.g. PRs from other forks) build.sh falls back to a throwaway key.
      - name: Build
        env:
          BUILD_TOOLS: "36.0.0"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE="$RUNNER_TEMP/release.keystore" KEY_ALIAS=cleanlauncher
          fi
          sh build.sh
          sh tools/diagnostico/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-${{ github.sha }}
          path: build/CleanLauncher.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-${{ github.sha }}
          path: tools/diagnostico/build/Diagnostico.apk
          if-no-files-found: error
